# Minimal authoritative BIND configuration for VM2.
# Installed as /etc/named.conf by uaf2_prepare_initiator.sh.

options {
	directory "/var/named";
	listen-on port 53 { 127.0.0.1; @@DNS_IP@@; };
	listen-on-v6 { none; };
	allow-query { any; };
	recursion no;
	minimal-responses yes;
	pid-file "/run/named/named.pid";
	session-keyfile "/run/named/session.key";
};

logging {
	channel uaf2_log {
		file "/var/log/named/uaf2.log" versions 2 size 5m;
		severity debug 3;
		print-time yes;
	};
	category queries { uaf2_log; };
};

zone "uaf2-poc.net" IN {
	type master;
	file "uaf2-poc.net.zone";
};
